name: CI Frontend
on:
  push:
    paths: ['apps/frontend/**']
  pull_request:
    paths: ['apps/frontend/**']

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.1.3 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'pnpm' }
      - run: pnpm install
      - run: cd apps/frontend && pnpm lint && pnpm test
