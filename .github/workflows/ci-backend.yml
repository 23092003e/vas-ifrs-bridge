name: CI Backend
on:
  push:
    paths:
      - 'apps/backend/**'
      - 'ingestion/**'
      - 'ingest.ps1'
      - 'skills/vas-ifrs-document-ingestion/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    paths:
      - 'apps/backend/**'
      - 'ingestion/**'
      - 'ingest.ps1'
      - 'skills/vas-ifrs-document-ingestion/**'
      - '.github/workflows/ci-backend.yml'

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install uv==0.11.15
      - run: cd apps/backend && uv sync --frozen --extra dev
      - run: cd apps/backend && uv run ruff check . && uv run mypy .
      - run: cd apps/backend && uv run pytest
