[project]
name = "vas-ifrs-qdrant-mcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28.1",
  "mcp>=1.28,<2",
  "qdrant-client>=1.13.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.25",
  "ruff>=0.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
