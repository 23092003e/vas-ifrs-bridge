apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vas-ifrs-ingress
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - vas-ifrs.example.com
      secretName: vas-ifrs-tls
  rules:
    - host: vas-ifrs.example.com
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
