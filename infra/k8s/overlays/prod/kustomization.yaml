apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vas-ifrs-prod
resources:
  - ../../base
replicas:
  - name: backend
    count: 3
  - name: frontend
    count: 3
  - name: celery-worker
    count: 3
patches:
  - target:
      kind: Deployment
      name: ollama
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          cloud.google.com/gke-accelerator: nvidia-tesla-t4
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: workload
            operator: Equal
            value: ollama
            effect: NoSchedule
      - op: add
        path: /spec/template/spec/containers/0/resources/limits/nvidia.com~1gpu
        value: "1"
