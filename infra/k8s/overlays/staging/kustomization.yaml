apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vas-ifrs-staging
resources:
  - ../../base
configMapGenerator:
  - name: vas-ifrs-config
    behavior: merge
    literals:
      - APP_ENV=staging
replicas:
  - name: backend
    count: 1
  - name: frontend
    count: 1
  - name: celery-worker
    count: 1
