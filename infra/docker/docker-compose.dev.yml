services:
  backend:
    build: ../../apps/backend
    ports: ["8000:8000"]
    env_file: ../../apps/backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://user:pass@db:5432/vasifrs
      - QDRANT_URL=${QDRANT_URL:-http://host.docker.internal:6333}
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ../../apps/frontend
    ports: ["3000:3000"]
    env_file: ../../apps/frontend/.env.local
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    ports: ["5432:5432"]
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=pass
      - POSTGRES_DB=vasifrs
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d vasifrs"]
      interval: 5s
      timeout: 3s
      retries: 10

  # qdrant:
  #   image: qdrant/qdrant:latest
  #   ports: ["6333:6333", "6334:6334"]
  #   volumes: [qdrant_data:/qdrant/storage]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: [ollama_data:/root/.ollama]

volumes:
  postgres_data:
  # qdrant_data:
  redis_data:
  ollama_data:
